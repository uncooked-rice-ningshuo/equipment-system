name: Build Electron App and Notify Feishu

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:  # 也支持手动触发

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store path
        id: pnpm_store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm_store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build Electron app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            pnpm run build:win
          else
            pnpm run build:mac
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: release/**
          if-no-files-found: error
      

  release:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(node -p "require('./package.json').version")"
            echo "release_tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.meta.outputs.release_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload_release_assets:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    needs: [build, release]
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ubuntu-latest
    concurrency:
      group: release-assets-${{ github.repository }}-${{ needs.release.outputs.release_tag }}-${{ matrix.os }}
      cancel-in-progress: false
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: artifacts/${{ matrix.os }}

      - name: Install jq
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Upload release assets (replace on conflict)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          API="https://api.github.com"
          REPO="${{ github.repository }}"
          AUTH="Authorization: Bearer $GITHUB_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"

          urlencode() {
            python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$1"
          }

          release_json="$(curl -sS -H "$AUTH" -H "$ACCEPT" "${API}/repos/${REPO}/releases/tags/${RELEASE_TAG}")"
          release_id="$(echo "$release_json" | jq -r '.id')"
          upload_url="$(echo "$release_json" | jq -r '.upload_url' | sed 's/{?name,label}$//')"

          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "$release_json"
            exit 1
          fi

          delete_asset_by_name() {
            local asset_name="$1"
            local page=1
            while :; do
              local assets
              assets="$(curl -sS -H "$AUTH" -H "$ACCEPT" "${API}/repos/${REPO}/releases/${release_id}/assets?per_page=100&page=${page}")"
              local count
              count="$(echo "$assets" | jq 'length')"
              if [ "$count" -eq 0 ]; then
                break
              fi

              local ids
              ids="$(echo "$assets" | jq -r --arg n "$asset_name" '.[] | select(.name == $n) | .id')"
              if [ -n "$ids" ]; then
                while IFS= read -r id; do
                  [ -n "$id" ] || continue
                  curl -sS -X DELETE -H "$AUTH" -H "$ACCEPT" "${API}/repos/${REPO}/releases/assets/${id}" >/dev/null || true
                done <<< "$ids"
              fi

              if [ "$count" -lt 100 ]; then
                break
              fi
              page=$((page + 1))
            done
          }

          asset_exists() {
            local asset_name="$1"
            local page=1
            while :; do
              local assets
              assets="$(curl -sS -H "$AUTH" -H "$ACCEPT" "${API}/repos/${REPO}/releases/${release_id}/assets?per_page=100&page=${page}")"
              local count
              count="$(echo "$assets" | jq 'length')"
              if [ "$count" -eq 0 ]; then
                return 1
              fi
              if echo "$assets" | jq -e --arg n "$asset_name" '.[] | select(.name == $n)' >/dev/null 2>&1; then
                return 0
              fi
              if [ "$count" -lt 100 ]; then
                return 1
              fi
              page=$((page + 1))
            done
          }

          wait_asset_gone() {
            local asset_name="$1"
            local max_wait_s="${2:-90}"
            local waited=0
            while [ "$waited" -lt "$max_wait_s" ]; do
              if ! asset_exists "$asset_name"; then
                return 0
              fi
              sleep 3
              waited=$((waited + 3))
            done
            return 1
          }

          upload_one() {
            local file="$1"
            local name
            name="$(basename "$file")"
            local qname
            qname="$(urlencode "$name")"

            for attempt in 1 2 3 4 5; do
              local resp
              resp="$(mktemp)"
              local code
              code="$(curl -sS -o "$resp" -w "%{http_code}" -X POST \
                -H "$AUTH" -H "$ACCEPT" -H "Content-Type: application/octet-stream" \
                --data-binary @"$file" \
                "${upload_url}?name=${qname}" || true)"

              if [ "$code" = "201" ]; then
                rm -f "$resp"
                return 0
              fi

              if [ "$code" = "422" ] && jq -e '.errors[]? | select(.code=="already_exists" and .field=="name")' "$resp" >/dev/null 2>&1; then
                echo "Conflict detected, deleting and retrying: $name"
                rm -f "$resp"
                delete_asset_by_name "$name"
                if ! wait_asset_gone "$name" 90; then
                  echo "Asset still exists after delete: $name"
                fi
                sleep $((attempt * 5))
                continue
              fi

              echo "Upload failed: $name (http=$code)"
              cat "$resp"
              rm -f "$resp"
              return 1
            done

            echo "Final asset list (filtered):"
            curl -sS -H "$AUTH" -H "$ACCEPT" "${API}/repos/${REPO}/releases/${release_id}/assets?per_page=100&page=1" | jq -r --arg n "$name" '.[] | select(.name == $n) | "\(.id) \(.name) \(.size)"' || true
            echo "Upload failed after retries: $name"
            return 1
          }

          shopt -s nullglob
          files=(artifacts/${{ matrix.os }}/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No files found under artifacts/${{ matrix.os }}/"
            exit 1
          fi

          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            upload_one "$f"
          done

  notify_feishu:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    needs: [upload_release_assets, release]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows-latest
          path: artifacts/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-macos-latest
          path: artifacts/macos

      - name: Send to Feishu
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
        shell: bash
        run: |
          RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          WIN_FILE="$(ls artifacts/windows/*.exe 2>/dev/null | head -n 1 || true)"
          MAC_FILE="$(ls artifacts/macos/*.dmg 2>/dev/null | head -n 1 || true)"

          WIN_NAME=""
          MAC_NAME=""
          if [ -n "$WIN_FILE" ]; then WIN_NAME="$(basename "$WIN_FILE")"; fi
          if [ -n "$MAC_FILE" ]; then MAC_NAME="$(basename "$MAC_FILE")"; fi

          CONTENT="**版本：** ${RELEASE_TAG}"
          if [ -n "$WIN_NAME" ]; then CONTENT="${CONTENT}\n**Windows：** ${WIN_NAME}"; fi
          if [ -n "$MAC_NAME" ]; then CONTENT="${CONTENT}\n**macOS：** ${MAC_NAME}"; fi

          curl -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"msg_type\": \"interactive\",
              \"card\": {
                \"header\": {
                  \"title\": {
                    \"tag\": \"plain_text\",
                    \"content\": \"🚀 Electron 应用发布通知\"
                  },
                  \"template\": \"blue\"
                },
                \"elements\": [
                  {
                    \"tag\": \"div\",
                    \"text\": {
                      \"tag\": \"lark_md\",
                      \"content\": \"${CONTENT}\"
                    }
                  },
                  {
                    \"tag\": \"action\",
                    \"actions\": [
                      {
                        \"tag\": \"button\",
                        \"text\": {
                          \"tag\": \"plain_text\",
                          \"content\": \"⬇️ 下载 (Release) \"
                        },
                        \"type\": \"primary\",
                        \"url\": \"${RELEASE_URL}\"
                      },
                      {
                        \"tag\": \"button\",
                        \"text\": {
                          \"tag\": \"plain_text\",
                          \"content\": \"📋 查看 Release 页面\"
                        },
                        \"type\": \"default\",
                        \"url\": \"${RELEASE_URL}\"
                      }
                    ]
                  }
                ]
              }
            }"
