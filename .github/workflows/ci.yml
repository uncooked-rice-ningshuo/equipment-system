name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  lint:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        env:
          npm_config_disturl: https://nodejs.org/download/release
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build shared packages
        run: pnpm --filter "@equipment/*" build
      - name: Lint
        run: pnpm lint

  build-electron:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Fix npm_execpath for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pnpmCandidates = @()
          try { $pnpmCandidates = (where.exe pnpm) } catch { $pnpmCandidates = @() }
          $pnpmCmd = $pnpmCandidates | Where-Object { $_.ToLower().EndsWith('.cmd') } | Select-Object -First 1
          if (-not $pnpmCmd) { $pnpmCmd = $pnpmCandidates | Select-Object -First 1 }
          if (-not $pnpmCmd) { $pnpmCmd = "pnpm" }

          $nodeExe = (Get-Command node).Source

          "npm_execpath=$pnpmCmd" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "npm_node_execpath=$nodeExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install dependencies
        env:
          npm_config_disturl: https://nodejs.org/download/release
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build shared packages
        run: pnpm --filter "@equipment/*" build
      - name: Build Electron
        run: pnpm --filter @equipment/electron-app build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: packages/electron-app/dist-electron/
          if-no-files-found: ignore

  build-web:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        env:
          npm_config_disturl: https://nodejs.org/download/release
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build shared packages
        run: pnpm --filter "@equipment/*" build
      - name: Build Web
        run: pnpm --filter @equipment/web build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: packages/web/.next/

  build-installers:
    name: Build Installers
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            pnpm run release:electron:win
          else
            pnpm run release:electron:mac
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: packages/electron-app/dist-electron/*
          if-no-files-found: error

  release:
    name: Create or Update Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(node -p "require('./package.json').version")"
            echo "release_tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install jq
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Delete existing release and tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com"
          REPO="${{ github.repository }}"
          AUTH="Authorization: Bearer $GITHUB_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"

          rel="$(curl -sS -H "$AUTH" -H "$ACCEPT" "${API}/repos/${REPO}/releases/tags/${RELEASE_TAG}" || true)"
          id="$(echo "$rel" | jq -r '.id // empty' || true)"
          if [ -n "$id" ]; then
            curl -sS -X DELETE -H "$AUTH" -H "$ACCEPT" "${API}/repos/${REPO}/releases/${id}" >/dev/null || true
          fi

          curl -sS -X DELETE -H "$AUTH" -H "$ACCEPT" "${API}/repos/${REPO}/git/refs/tags/${RELEASE_TAG}" >/dev/null || true

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.meta.outputs.release_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload_release_assets:
    name: Upload Release Assets
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build-installers, release]
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ubuntu-latest
    concurrency:
      group: release-assets-${{ github.repository }}-${{ needs.release.outputs.release_tag }}-${{ matrix.os }}
      cancel-in-progress: false
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: artifacts/${{ matrix.os }}

      - name: Upload release assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.release.outputs.release_tag }}
          overwrite: true
          file_glob: true
          file: artifacts/${{ matrix.os }}/*

  notify_feishu_release:
    name: 发布通知
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [upload_release_assets, release]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows-latest
          path: artifacts/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-macos-latest
          path: artifacts/macos

      - name: Send to Feishu
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
        shell: bash
        run: |
          RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          WIN_FILE="$(ls artifacts/windows/*.exe 2>/dev/null | head -n 1 || true)"
          MAC_FILE="$(ls artifacts/macos/*.dmg 2>/dev/null | head -n 1 || true)"

          WIN_NAME=""
          MAC_NAME=""
          if [ -n "$WIN_FILE" ]; then WIN_NAME="$(basename "$WIN_FILE")"; fi
          if [ -n "$MAC_FILE" ]; then MAC_NAME="$(basename "$MAC_FILE")"; fi

          CONTENT="**版本：** ${RELEASE_TAG}"
          if [ -n "$WIN_NAME" ]; then CONTENT="${CONTENT}\n**Windows：** ${WIN_NAME}"; fi
          if [ -n "$MAC_NAME" ]; then CONTENT="${CONTENT}\n**macOS：** ${MAC_NAME}"; fi

          curl -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"msg_type\": \"interactive\",
              \"card\": {
                \"header\": {
                  \"title\": {
                    \"tag\": \"plain_text\",
                    \"content\": \"🚀 Electron 应用发布通知\"
                  },
                  \"template\": \"blue\"
                },
                \"elements\": [
                  {
                    \"tag\": \"div\",
                    \"text\": {
                      \"tag\": \"lark_md\",
                      \"content\": \"${CONTENT}\"
                    }
                  },
                  {
                    \"tag\": \"action\",
                    \"actions\": [
                      {
                        \"tag\": \"button\",
                        \"text\": {
                          \"tag\": \"plain_text\",
                          \"content\": \"⬇️ 下载 (Release) \"
                        },
                        \"type\": \"primary\",
                        \"url\": \"${RELEASE_URL}\"
                      },
                      {
                        \"tag\": \"button\",
                        \"text\": {
                          \"tag\": \"plain_text\",
                          \"content\": \"📋 查看 Release 页面\"
                        },
                        \"type\": \"default\",
                        \"url\": \"${RELEASE_URL}\"
                      }
                    ]
                  }
                ]
              }
            }"

  notify_feishu:
    name: CI 结果通知
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: [lint, build-electron, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Download web artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: artifacts/web

      - name: Download Electron artifacts (Ubuntu)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: electron-ubuntu-latest
          path: artifacts/electron/ubuntu

      - name: Download Electron artifacts (Windows)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: electron-windows-latest
          path: artifacts/electron/windows

      - name: Download Electron artifacts (macOS)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: electron-macos-latest
          path: artifacts/electron/macos

      - name: Send to Feishu
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          LINT_RESULT: ${{ needs.lint.result }}
          ELECTRON_RESULT: ${{ needs.build-electron.result }}
          WEB_RESULT: ${{ needs.build-web.result }}
        shell: bash
        run: |
          set -euo pipefail

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REF_NAME="${{ github.ref_name }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"

          OVERALL="success"
          if [ "${LINT_RESULT}" != "success" ] || [ "${ELECTRON_RESULT}" != "success" ] || [ "${WEB_RESULT}" != "success" ]; then
            OVERALL="failed"
          fi

          TITLE="CI 通过"
          TEMPLATE="green"
          if [ "${OVERALL}" != "success" ]; then
            TITLE="CI 失败"
            TEMPLATE="red"
          fi

          WEB_FILES_COUNT="0"
          if [ -d artifacts/web ]; then
            WEB_FILES_COUNT="$(find artifacts/web -type f | wc -l | tr -d ' ')"
          fi

          CONTENT="**仓库：** ${{ github.repository }}\n**分支：** ${REF_NAME}\n**提交：** ${SHORT_SHA}\n**Lint：** ${LINT_RESULT}\n**Electron：** ${ELECTRON_RESULT}\n**Web：** ${WEB_RESULT}\n**Web 产物文件数：** ${WEB_FILES_COUNT}"

          curl -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"msg_type\": \"interactive\",
              \"card\": {
                \"header\": {
                  \"title\": {
                    \"tag\": \"plain_text\",
                    \"content\": \"${TITLE}\"
                  },
                  \"template\": \"${TEMPLATE}\"
                },
                \"elements\": [
                  {
                    \"tag\": \"div\",
                    \"text\": {
                      \"tag\": \"lark_md\",
                      \"content\": \"${CONTENT}\"
                    }
                  },
                  {
                    \"tag\": \"action\",
                    \"actions\": [
                      {
                        \"tag\": \"button\",
                        \"text\": {
                          \"tag\": \"plain_text\",
                          \"content\": \"查看 CI 运行\"
                        },
                        \"type\": \"primary\",
                        \"url\": \"${RUN_URL}\"
                      }
                    ]
                  }
                ]
              }
            }"
