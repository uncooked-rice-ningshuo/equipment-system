name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        env:
          npm_config_disturl: https://nodejs.org/download/release
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build shared packages
        run: pnpm --filter "@equipment/*" build
      - name: Lint
        run: pnpm lint

  build-electron:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Fix npm_execpath for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pnpmCandidates = @()
          try { $pnpmCandidates = (where.exe pnpm) } catch { $pnpmCandidates = @() }
          $pnpmCmd = $pnpmCandidates | Where-Object { $_.ToLower().EndsWith('.cmd') } | Select-Object -First 1
          if (-not $pnpmCmd) { $pnpmCmd = $pnpmCandidates | Select-Object -First 1 }
          if (-not $pnpmCmd) { $pnpmCmd = "pnpm" }

          $nodeExe = (Get-Command node).Source

          "npm_execpath=$pnpmCmd" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "npm_node_execpath=$nodeExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install dependencies
        env:
          npm_config_disturl: https://nodejs.org/download/release
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build shared packages
        run: pnpm --filter "@equipment/*" build
      - name: Build Electron
        run: pnpm --filter @equipment/electron-app build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: packages/electron-app/dist-electron/
          if-no-files-found: ignore

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        env:
          npm_config_disturl: https://nodejs.org/download/release
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build shared packages
        run: pnpm --filter "@equipment/*" build
      - name: Build Web
        run: pnpm --filter @equipment/web build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: packages/web/.next/
